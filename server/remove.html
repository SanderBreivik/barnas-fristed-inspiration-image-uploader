<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fjern bilde</title><main style="font:16px system-ui;max-width:550px;margin:80px auto;padding:20px"><h1>Fjern ditt bilde</h1><p>Bruk lenken du fikk etter opplasting.</p><button id="remove">Fjern bildet mitt</button><p id="msg"></p></main><script>const btn=document.getElementById('remove'),msg=document.getElementById('msg');btn.onclick=async()=>{if(!confirm('Vil du slette bildet?'))return;const u=new URL(location.href),id=u.searchParams.get('id'),token=u.searchParams.get('token');if(!id||!token){msg.textContent='Lenken er ugyldig eller ufullstendig.';return}btn.disabled=true;try{const r=await fetch('/api/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,token})});const d=await r.json().catch(()=>({}));if(r.status===200){msg.textContent=d.alreadyRemoved?'Bildet er allerede fjernet.':'Bildet er fjernet.';history.replaceState(null,'','/remove.html')}else if(r.status===202){msg.textContent='Bildet er fjernet fra galleriet. Slettingen fullføres; prøv igjen senere for å bekrefte.';btn.disabled=false}else if(r.status===403){msg.textContent='Lenken er ugyldig. Kontakt butikken hvis du trenger hjelp.'}else{msg.textContent='Noe gikk galt. Prøv igjen senere eller kontakt butikken.';btn.disabled=false}}catch{msg.textContent='Kunne ikke nå serveren. Prøv igjen senere.';btn.disabled=false}}</script></html>
