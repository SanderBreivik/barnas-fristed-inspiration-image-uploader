<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fjern bilde</title><main style="font:16px system-ui;max-width:550px;margin:80px auto;padding:20px"><h1>Fjern ditt bilde</h1><p>Bruk lenken du fikk etter opplasting.</p><button id="remove">Fjern bildet mitt</button><p id="msg"></p></main><script>document.getElementById('remove').onclick=async()=>{if(!confirm('Vil du slette bildet?'))return;const u=new URL(location.href);const r=await fetch('/api/remove',{method:'POST',headers:{'Content-Type':'application/json','Origin':location.origin},body:JSON.stringify({id:u.searchParams.get('id'),token:u.searchParams.get('token')})});document.getElementById('msg').textContent=r.ok?'Bildet er fjernet.':'Kunne ikke fjerne bildet. Kontakt butikken.';if(r.ok)history.replaceState(null,'','/remove.html')}</script></html>
