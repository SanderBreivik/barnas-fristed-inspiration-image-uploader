<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Inspirasjon – moderering</title><style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f2ee;color:#252525}
header{background:#252525;color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px}
header small{display:block;color:#bbb;font-size:12px;font-weight:400}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid #d6d2ca;background:#fff;color:#252525}
button{cursor:pointer;font-weight:550;transition:background .15s,transform .05s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7aa37a;outline-offset:2px}
.primary{background:#5b8a5b;border-color:#5b8a5b;color:#fff}.primary:hover{background:#4a764a}
.ghost{background:transparent;color:#fff;border-color:#666}.ghost:hover{background:#3a3a3a}
.tabs{display:flex;gap:6px;padding:16px 24px 0;max-width:1400px;margin:auto;align-items:center;flex-wrap:wrap}
.tabs select{min-width:160px}
#msg{max-width:1400px;margin:10px auto 0;padding:0 24px;color:#8a3b2e;min-height:1.5em}
#photos{max-width:1400px;margin:0 auto;padding:12px 24px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column}
.thumb{background:#ebe8e1;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:650}.desc{color:#444;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;padding:2px 10px;border-radius:999px;background:#eceae4;color:#555}
.chip.yes{background:#dcebdc;color:#2e5a2e}.chip.no{background:#f1e2df;color:#8a3b2e}
.date{font-size:12px;color:#888;margin-top:2px}
.actions{display:flex;gap:8px;padding:12px 16px 16px}
.actions button{flex:1}
.ok{background:#5b8a5b;border-color:#5b8a5b;color:#fff}.ok:hover{background:#4a764a}
.no-btn{background:#fff}.no-btn:hover{background:#f4f2ee}
.del{color:#a3392b;border-color:#e3c3be}.del:hover{background:#f9eceb}
.empty{grid-column:1/-1;text-align:center;color:#777;padding:60px 0}
@media(max-width:560px){header,.tabs,#msg,#photos{padding-left:14px;padding-right:14px}#photos{grid-template-columns:1fr}}
</style>
<header><h1>Moderering<small>Barnas Fristed – inspirasjon</small></h1><div class="bar"><input type="password" id="password" autocomplete="current-password" placeholder="Administratorpassord"><button id="login" class="primary">Logg inn</button><button id="logout" class="ghost">Logg ut</button></div></header>
<div class="tabs"><select id="status" aria-label="Status"><option value="pending">Venter</option><option value="approved">Godkjente</option><option value="rejected">Avviste</option></select><button id="load">Oppdater</button></div>
<p id="msg" role="status"></p><div id="photos"></div><script>const pass=document.getElementById('password'),msg=document.getElementById('msg'),box=document.getElementById('photos');let csrf='';async function api(path,opts={}){return fetch(path,{...opts,credentials:'same-origin',headers:{'X-CSRF-Token':csrf,...opts.headers}})}async function login(){const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});pass.value='';if(r.status===429){msg.textContent='For mange forsøk. Prøv igjen senere.';return}if(!r.ok){msg.textContent='Feil passord';return}csrf=(await r.json()).csrf;msg.textContent='';load()}async function load(){box.replaceChildren();const r=await api('/api/admin/photos?status='+document.getElementById('status').value);if(r.status===401){msg.textContent='Logg inn for å fortsette';return}if(!r.ok){msg.textContent='Feil ved henting';return}msg.textContent='';const d=await r.json();for(const p of d.photos){const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};const card=el('div','card'),thumb=el('div','thumb'),img=document.createElement('img');img.alt=p.description||'Innsendt bilde';const preview=await api('/api/admin/preview/'+p.id);if(preview.ok)img.src=URL.createObjectURL(await preview.blob());thumb.append(img);card.append(thumb);const body=el('div','body');body.append(el('div','name',p.display_name||'Anonym'));if(p.description)body.append(el('div','desc',p.description));const meta=el('div','meta');meta.append(el('span','chip',p.product_handle?'Produkt: '+p.product_handle:'Ingen produkt'),el('span','chip '+(p.marketing_consent?'yes':'no'),p.marketing_consent?'Markedsføring: ja':'Markedsføring: nei'));body.append(meta);if(p.submitted_at)body.append(el('div','date','Sendt '+new Date(p.submitted_at).toLocaleString('nb-NO')));card.append(body);const acts=el('div','actions');const st=document.getElementById('status').value;for(const action of ['approve','reject','delete']){if(action==='approve'&&st==='approved')continue;if(action==='reject'&&st!=='pending'&&st!=='approved')continue;const b=el('button',{approve:'ok',reject:'no-btn',delete:'del'}[action]);b.textContent={approve:'Godkjenn',reject:'Avvis',delete:'Slett'}[action];b.onclick=async()=>{if(action==='delete'&&!confirm('Slett bildet permanent?'))return;const r=await api('/api/admin/photos/'+p.id+'/'+action,{method:'POST'});if(r.ok)load();else msg.textContent='Handlingen feilet'};acts.append(b)}card.append(acts);box.append(card)}if(!d.photos.length){const e=document.createElement('div');e.className='empty';e.textContent='Ingen bilder her akkurat nå.';box.append(e)}}document.getElementById('login').onclick=login;pass.onkeydown=e=>{if(e.key==='Enter')login()};document.getElementById('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});csrf='';box.replaceChildren();msg.textContent='Logget ut'};document.getElementById('load').onclick=load;(async()=>{const r=await fetch('/api/admin/session',{credentials:'same-origin'});if(r.ok){csrf=(await r.json()).csrf;load()}})();</script></html>
