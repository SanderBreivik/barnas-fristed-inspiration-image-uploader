<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Inspirasjon – moderering</title><style>body{font:16px system-ui;max-width:1100px;margin:40px auto;padding:15px}input,button,select{padding:10px}button{cursor:pointer}.card{display:inline-block;vertical-align:top;width:250px;border:1px solid #ddd;margin:10px;padding:12px;border-radius:8px}.card img{width:100%;height:200px;object-fit:contain}.card p{overflow-wrap:anywhere}</style><h1>Moderer kundebilder</h1><p>Innloggingen bruker en sikker øktcookie som utløper automatisk.</p><input type="password" id="password" autocomplete="current-password" placeholder="Administratorpassord"><button id="login">Logg inn</button><button id="logout">Logg ut</button><select id="status"><option value="pending">Venter</option><option value="approved">Godkjente</option><option value="rejected">Avviste</option></select><button id="load">Hent bilder</button><p id="msg" role="status"></p><div id="photos"></div><script>const pass=document.getElementById('password'),msg=document.getElementById('msg'),box=document.getElementById('photos');let csrf='';async function api(path,opts={}){return fetch(path,{...opts,credentials:'same-origin',headers:{'X-CSRF-Token':csrf,...opts.headers}})}async function login(){const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});pass.value='';if(r.status===429){msg.textContent='For mange forsøk. Prøv igjen senere.';return}if(!r.ok){msg.textContent='Feil passord';return}csrf=(await r.json()).csrf;msg.textContent='';load()}async function load(){box.replaceChildren();const r=await api('/api/admin/photos?status='+document.getElementById('status').value);if(r.status===401){msg.textContent='Logg inn for å fortsette';return}if(!r.ok){msg.textContent='Feil ved henting';return}msg.textContent='';const d=await r.json();for(const p of d.photos){const card=document.createElement('div');card.className='card';const img=document.createElement('img');const preview=await api('/api/admin/preview/'+p.id);if(preview.ok)img.src=URL.createObjectURL(await preview.blob());card.append(img);for(const v of [p.display_name||'Anonym',p.description||'',p.product_handle||'Ingen produkt',p.marketing_consent?'Markedsføring: ja':'Markedsføring: nei']){const t=document.createElement('p');t.textContent=v;card.append(t)}for(const action of ['approve','reject','delete']){const b=document.createElement('button');b.textContent={approve:'Godkjenn',reject:'Avvis',delete:'Slett'}[action];b.onclick=async()=>{if(action==='delete'&&!confirm('Slett bildet permanent?'))return;const r=await api('/api/admin/photos/'+p.id+'/'+action,{method:'POST'});if(r.ok)load();else msg.textContent='Handlingen feilet'};card.append(b)}box.append(card)}}document.getElementById('login').onclick=login;pass.onkeydown=e=>{if(e.key==='Enter')login()};document.getElementById('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});csrf='';box.replaceChildren();msg.textContent='Logget ut'};document.getElementById('load').onclick=load;(async()=>{const r=await fetch('/api/admin/session',{credentials:'same-origin'});if(r.ok){csrf=(await r.json()).csrf;load()}})();</script></html>
